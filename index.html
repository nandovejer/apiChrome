<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Translator API Demo – Luz DS</title>
    <link rel="stylesheet" href="vendor/luz/luz-tokens.min.css" />
    <link rel="stylesheet" href="vendor/luz/luz.min.css" />
    <script type="module" src="index.js" defer></script>
  </head>
  <body>
    <main class="o-container o-stack">
      <h1>AI Translator in Chrome</h1>
      <p>
        Example using the <strong>Chrome Translator API</strong> (only available
        in Chrome 138+ desktop) 100% in your device, you can use this offline. Select source and target language and
        translate.
      </p>

      <section>
        <form id="translateForm" class="o-stack">
          <div class="luz-field">
            <label class="luz-field__label" for="textInput">Text to translate</label>
            <textarea
              class="luz-input luz-input--textarea"
              id="textInput"
              name="textInput"
              rows="4"
              placeholder="Write here..."
              required
            ></textarea>
          </div>

          <div class="o-grid o-grid--2">
            <div class="luz-field">
              <label class="luz-field__label" for="sourceLang">Source</label>
              <select class="luz-select" id="sourceLang" name="sourceLang">
                <option value="en" selected>English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt-BR">Portuguese (Brazil)</option>
                <option value="pt-PT">Portuguese (Portugal)</option>
                <option value="ru">Russian</option>
                <option value="zh-CN">Chinese (Simplified)</option>
                <option value="zh-TW">Chinese (Traditional)</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
                <option value="hi">Hindi</option>
                <option value="es-419">Spanish (Latin America)</option>
                <!-- Others -->
                <option value="am">Amharic</option>
                <option value="bg">Bulgarian</option>
                <option value="bn">Bengali</option>
                <option value="ca">Catalan</option>
                <option value="cs">Czech</option>
                <option value="da">Danish</option>
                <option value="el">Greek</option>
                <option value="et">Estonian</option>
                <option value="fa">Persian</option>
                <option value="fi">Finnish</option>
                <option value="fil">Filipino</option>
                <option value="gu">Gujarati</option>
                <option value="he">Hebrew</option>
                <option value="hr">Croatian</option>
                <option value="hu">Hungarian</option>
                <option value="id">Indonesian</option>
                <option value="kn">Kannada</option>
                <option value="lt">Lithuanian</option>
                <option value="lv">Latvian</option>
                <option value="ml">Malayalam</option>
                <option value="mr">Marathi</option>
                <option value="ms">Malay</option>
                <option value="nl">Dutch</option>
                <option value="no">Norwegian</option>
                <option value="pl">Polish</option>
                <option value="ro">Romanian</option>
                <option value="sk">Slovak</option>
                <option value="sl">Slovenian</option>
                <option value="sr">Serbian</option>
                <option value="sv">Swedish</option>
                <option value="sw">Swahili</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="th">Thai</option>
                <option value="tr">Turkish</option>
                <option value="uk">Ukrainian</option>
                <option value="vi">Vietnamese</option>
              </select>
            </div>

            <div class="luz-field">
              <label class="luz-field__label" for="targetLang">Target</label>
              <select class="luz-select" id="targetLang" name="targetLang">
                <option value="en">English</option>
                <option value="es" selected>Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt-BR">Portuguese (Brazil)</option>
                <option value="pt-PT">Portuguese (Portugal)</option>
                <option value="ru">Russian</option>
                <option value="zh-CN">Chinese (Simplified)</option>
                <option value="zh-TW">Chinese (Traditional)</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="ar">Arabic</option>
                <option value="hi">Hindi</option>
                <option value="es-419">Spanish (Latin America)</option>
                <!-- Others -->
                <option value="am">Amharic</option>
                <option value="bg">Bulgarian</option>
                <option value="bn">Bengali</option>
                <option value="ca">Catalan</option>
                <option value="cs">Czech</option>
                <option value="da">Danish</option>
                <option value="el">Greek</option>
                <option value="et">Estonian</option>
                <option value="fa">Persian</option>
                <option value="fi">Finnish</option>
                <option value="fil">Filipino</option>
                <option value="gu">Gujarati</option>
                <option value="he">Hebrew</option>
                <option value="hr">Croatian</option>
                <option value="hu">Hungarian</option>
                <option value="id">Indonesian</option>
                <option value="kn">Kannada</option>
                <option value="lt">Lithuanian</option>
                <option value="lv">Latvian</option>
                <option value="ml">Malayalam</option>
                <option value="mr">Marathi</option>
                <option value="ms">Malay</option>
                <option value="nl">Dutch</option>
                <option value="no">Norwegian</option>
                <option value="pl">Polish</option>
                <option value="ro">Romanian</option>
                <option value="sk">Slovak</option>
                <option value="sl">Slovenian</option>
                <option value="sr">Serbian</option>
                <option value="sv">Swedish</option>
                <option value="sw">Swahili</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="th">Thai</option>
                <option value="tr">Turkish</option>
                <option value="uk">Ukrainian</option>
                <option value="vi">Vietnamese</option>
              </select>
            </div>
          </div>

          <div>
            <button class="luz-btn luz-btn--primary" type="submit">Translate</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Translation</h2>
        <article class="luz-card">
          <p class="luz-card__body" id="translationOutput" aria-live="polite">
            Waiting for text...
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
